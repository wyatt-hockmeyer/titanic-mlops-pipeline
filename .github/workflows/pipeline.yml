# pipeline.yml
# GitHub Actions workflow: retrains, tests, packages, and monitors the model whenever code or data changes
# Location: .github/workflows/pipeline.yml

# Name shown on the GitHub Actions page
name: Titanic MLOps Pipeline

# Events that start the pipeline
on:
  # Run on every push to the main branch...
  push:
    branches: [ "main" ]
    # ...but only when one of these files or folders changed (documented exception: path filters)
    paths:
      - "data/**"
      - "**.py"
      - "requirements.txt"
      - "requirements-api.txt"
      - "Dockerfile"
      - ".github/workflows/**"
  # Also allow a manual run from the Actions tab
  workflow_dispatch:

# The work to do
jobs:
  # One job named train-and-test
  train-and-test:
    # Run on a fresh Linux machine provided by GitHub
    runs-on: ubuntu-latest

    # The steps run in order; if any step fails, the run stops and turns red
    steps:
      # Download the repository code onto the machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Python 3.12, the same version used on the Mac
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install every package listed in requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Clean the raw data and add features
      - name: Preprocess data
        run: python preprocess.py

      # Train the model, log it to MLflow, and save model.pkl
      - name: Train model
        run: python train.py

      # Check the data and the model; a failed check fails the run
      - name: Test model
        run: python test_model.py

      # Package the API and the new model into a Docker image (Lesson 39 Demo 2)
      - name: Build Docker image
        run: docker build -t titanic-api:v1 .

      # Start the container in the background, then wait for the API to load
      - name: Start API container
        run: |
          docker run -d -p 8000:8000 titanic-api:v1
          sleep 15

      # Send test requests to the running container
      - name: Test API
        run: python test_api.py

      # Build the Evidently drift and performance reports and print any alerts (Lesson 39 Demo 3)
      - name: Run monitoring
        run: python monitor.py

      # Save the trained model so it can be downloaded from the run page
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: titanic-model
          path: model.pkl

      # Save the monitoring reports so they can be downloaded from the run page
      - name: Upload monitoring reports
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: reports/